name: Test rule engine
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v test_engine_web test_interpretation test_deep_reading
      - run: python -m compileall -q app.py engine.py seed.py interpretation.py deep_reading.py
